name: Istra Research
description: 'Istra Research (Istra LLC) is a quantitative proprietary trading firm
  that develops data-centric algorithms and low-latency technology to participate
  in global financial markets. The firm employs researchers and engineers who build
  automated trading strategies grounded in advanced mathematics, statistics, and large-scale
  data analysis, spanning quantitative research, algorithm development, and custom
  hardware/VLSI and software engineering. Istra is a proprietary trading operation
  rather than an API-first technology vendor: it publishes no public developer portal,
  API, SDKs, or developer documentation, and its technology is used internally. It
  was surfaced in the API Evangelist network as a portfolio company of Battery Ventures.'
